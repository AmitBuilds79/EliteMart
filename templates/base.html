<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EliteMart</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid px-4">

        <!-- Logo -->
        <a class="navbar-brand fw-bold" href="/">🛒 EliteMart</a>

        <!-- Mobile Toggle -->
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navbar Content -->
        <div class="collapse navbar-collapse" id="navbarNav">

            <!-- Search Box -->
            <form class="d-flex mx-auto position-relative w-100"
      action="/search"
      method="GET"
      style="width:1000px; max-width:100%;"

    <i class="bi bi-search position-absolute"
style="left:20px; top:50%; transform:translateY(-50%); font-size:22px; color:#6c757d;"></i>

    <input
        type="search"
        name="q"
        class="form-control rounded-pill"
        placeholder="Search Products"
        style="height:56px; padding-left:55px; padding-right:110px; font-size:18px; border-radius:50px; border:2px solid #0d6efd;"

    <i class="bi bi-camera position-absolute"
style="right:60px; top:50%; transform:translateY(-50%); font-size:22px; color:#0d6efd; cursor:pointer;"></i>
    <i class="bi bi-mic-fill position-absolute"
    
style="right:25px; top:50%; transform:translateY(-50%); font-size:22px; color:#0d6efd; cursor:pointer;"></i>
</form>

            <!-- Menu -->
            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#products">Products</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('cart') }}">Cart</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('my_orders') }}">My Orders</a>
                </li>

                {% if session.get("user") %}

                <li class="nav-item">
                    <span class="nav-link text-warning">
                        Welcome, {{ session["user"] }}
                    </span>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/logout">Logout</a>
                </li>

                {% else %}

                <li class="nav-item">
                    <a class="nav-link" href="/login">Login</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/register">Register</a>
                </li>

                {% endif %}

            </ul>

        </div>
    </div>
</nav>

<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
